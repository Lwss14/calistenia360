<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Calistenia360 — Panel de clientes</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111311;--card:#1a1d1a;--card2:#151815;--line:#2b2f2a;--line2:#3a3f38;--txt:#edece6;--mut:#a3a89e;--acc:#e9a23b;--accbg:#33290f;--ok:#86cf93;--okbg:#1f3325;--bad:#e58572;--badbg:#3a1f1b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:15px;line-height:1.45}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt)}
.dsp{font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1;letter-spacing:.01em}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.sect{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.acc{color:var(--acc)}
.top{height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px;position:sticky;top:0;background:var(--bg);z-index:5}
.top .brand{font-size:24px;letter-spacing:.04em}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mut)}
.nav a.on{background:#232723;color:var(--txt);font-weight:600}
.wrap{max-width:1400px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:32px}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#15130d}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn.on{border-color:var(--acc);background:var(--accbg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2)}
.chip.acc{background:var(--accbg);color:var(--acc);border-color:transparent}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.chip.fill{background:var(--acc);color:#15130d;border-color:transparent;font-weight:700}
.h1row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.h1{font-size:52px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills a{padding:10px 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:600}
.prox{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:16px}
.prox .it{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.prox .it:hover{border-color:var(--line2)}
.sechd{display:flex;align-items:baseline;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sechd .t{font-size:28px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:16px;align-items:start}
.cc{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer}
.cc:hover{border-color:var(--line2)}
.ph{border:1.5px dashed #4a5048;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:10px;letter-spacing:.08em;flex-shrink:0;overflow:hidden;text-align:center}
.ph img{width:100%;height:100%;object-fit:cover}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.kv b{font-weight:600;text-align:right}
.rows{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.empty{border:1.5px dashed var(--line2);border-radius:16px;padding:24px;color:var(--mut);margin-top:16px}
.fhead{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.fname{font-size:52px;text-transform:uppercase}
.big{width:280px;padding:20px 24px;border-radius:16px;background:var(--card);border:1px solid var(--acc);display:flex;flex-direction:column;gap:4px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.chk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.dot{width:10px;height:10px;border-radius:999px;display:inline-block;margin-right:8px}
.two{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:980px){.two{grid-template-columns:1fr}.top{padding:0 16px}.wrap{padding:20px 16px}.h1,.fname{font-size:40px}.big{width:100%}}
.bar{height:8px;border-radius:999px;background:var(--line)}
.bar>div{height:8px;border-radius:999px;background:var(--acc)}
.pay{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #232723;font-size:14px}
.pay:last-child{border-bottom:none}
.tl{display:flex;gap:16px}
.tl .ln{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0}
.tl .ln i{width:12px;height:12px;border-radius:999px;margin-top:4px;border:2px solid var(--mut);background:var(--mut)}
.tl .ln s{width:2px;flex-grow:1;background:var(--line)}
.tl .bd{padding-bottom:18px}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.wk>div{border-radius:12px;padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.wk>div.now{background:var(--accbg);border-color:var(--acc)}
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.tests>div{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:14px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 8px;border-bottom:1px solid #232723;vertical-align:middle}
.tbl tr{cursor:pointer}.tbl tbody tr:hover td{background:var(--card2)}
.tw{overflow-x:auto}
textarea,input,select{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:20}
.modal.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:24px;width:100%;max-width:720px;display:flex;flex-direction:column;gap:16px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:640px){.fg{grid-template-columns:1fr}.tests{grid-template-columns:1fr}}
.fg label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
.fg label.full{grid-column:1/-1}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#232723;border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:30}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
const SB='https://xiflekecgnzklicszwmv.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpZmxla2VjZ256a2xpY3N6d212Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNDYwODQsImV4cCI6MjA4OTkyMjA4NH0.qyWonslWP1YfvgxgisfNM2VjQsKR_xSE0npZyfXrGHI';

/* ---------- sesión ---------- */
let SES=null;try{SES=JSON.parse(localStorage.getItem('c360_ses')||'null');}catch(e){}
function setSes(s){SES=s;try{s?localStorage.setItem('c360_ses',JSON.stringify(s)):localStorage.removeItem('c360_ses');}catch(e){}}
async function authCall(grant,body){
  const r=await fetch(SB+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token)throw new Error(j.error_description||j.msg||'No se ha podido iniciar sesión');
  setSes({at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,email:(j.user||{}).email||''});
}
async function token(){
  if(!SES)throw new Error('nosession');
  if(Date.now()>SES.exp){try{await authCall('refresh_token',{refresh_token:SES.rt});}catch(e){setSes(null);throw new Error('nosession');}}
  return SES.at;
}
async function api(path,method,body,prefer){
  const t=await token();
  const r=await fetch(SB+'/rest/v1/'+path,{method:method||'GET',headers:{'apikey':KEY,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':prefer||'return=representation'},body:body?JSON.stringify(body):null});
  if(r.status===401){setSes(null);throw new Error('nosession');}
  const txt=await r.text();const j=txt?JSON.parse(txt):null;
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||('Error '+r.status));
  return j;
}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const pd=s=>{if(!s)return null;const p=String(s).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=(s,short)=>{const d=s instanceof Date?s:pd(s);if(!d)return '—';return d.getDate()+' '+MES[d.getMonth()]+(short?'':' '+d.getFullYear());};
const dd=d=>Math.round((d-today())/86400000);
const eur=n=>(Math.round(n*100)/100).toLocaleString('es-ES')+' €';
const inDays=n=>n===0?'hoy':n===1?'mañana':n>0?'en '+n+' días':'hace '+(-n)+' días';
const dcol=n=>n<0?'var(--bad)':n<=7?'var(--bad)':n<=31?'var(--acc)':'var(--txt)';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200);}

const AP={entrenamiento:'Entrenamiento funcional | Calistenia',nutricion:'Nutrición + Rendimiento (hormonas)',cs360:'CS360 · Entrenamiento + Nutriperformance',rdd:'Rey de las Dominadas'};
const AP_ORDER=['entrenamiento','nutricion','cs360','rdd'];
const UPS={sin_ofrecer:'Sin ofrecer',agendado:'Llamada agendada',ofrecido:'Ofrecido',convertido:'Convertido',no:'No'};
const TES={por_confirmar:'Por confirmar',acordado:'Acordado',recibido:'Recibido',no:'No'};
const FP={mensual:'Mensual',unico:'Pago único',plazos:'A plazos',gratis:'Gratis'};

let F=[];
const byId=id=>F.find(f=>f.id===id);
const pagos=f=>Array.isArray(f.pagos)?f.pagos:[];
const facturado=f=>pagos(f).filter(p=>p.estado==='pagado').reduce((a,p)=>a+(+p.importe||0),0);
const pendiente=f=>pagos(f).filter(p=>p.estado!=='pagado').reduce((a,p)=>a+(+p.importe||0),0);
function nextCobro(f){
  if(f.forma_pago!=='mensual'||!f.dia_cobro)return null;
  const t=today();let d=new Date(t.getFullYear(),t.getMonth(),f.dia_cobro);
  if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,f.dia_cobro);return d;
}
function keyDate(f){
  if(f.fin)return{label:f.apartado==='rdd'?'Fin del programa':'Fin de plan',date:pd(f.fin)};
  const n=nextCobro(f);if(n)return{label:'Próximo cobro',date:n};
  return{label:f.forma_pago==='mensual'?'Próximo cobro':'Fin de plan',date:null};
}
function factTxt(f){
  const t=facturado(f);
  if(f.forma_pago==='gratis')return '0 € · plaza de testimonio';
  if(t>0)return eur(t)+(f.cuota_mensual?' · '+eur(+f.cuota_mensual)+'/mes':'');
  if(f.cuota_mensual)return eur(+f.cuota_mensual)+'/mes';
  return '—';
}
function photo(f,size,rad){return `<div class="ph" style="width:${size}px;height:${size}px;border-radius:${rad}px">${f.foto_url?`<img src="${esc(f.foto_url)}" alt="Foto de ${esc(f.nombre)}">`:'FOTO'}</div>`;}

/* ---------- login ---------- */
function renderLogin(msg){
  $('#app').innerHTML=`<div class="login"><div class="dsp" style="font-size:40px">CALISTENIA360</div><div class="mut">Panel privado del coach</div>
  <input id="lEmail" type="email" placeholder="Email" autocomplete="username"><input id="lPass" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button class="btn pri" id="lBtn">Entrar</button><div class="err" id="lErr">${esc(msg||'')}</div></div>`;
  const go=async()=>{$('#lErr').textContent='';$('#lBtn').disabled=true;
    try{await authCall('password',{email:$('#lEmail').value.trim(),password:$('#lPass').value});await boot();}
    catch(e){$('#lErr').textContent=e.message;$('#lBtn').disabled=false;}};
  $('#lBtn').onclick=go;$('#lPass').onkeydown=e=>{if(e.key==='Enter')go();};
}

/* ---------- marco ---------- */
function frame(inner,route){
  $('#app').innerHTML=`<div class="top"><div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap"><div class="dsp brand">CALISTENIA360</div>
  <div class="nav"><a href="#/clientes" class="${route==='clientes'?'on':''}">Clientes</a><a href="#/inactivos" class="${route==='inactivos'?'on':''}">Inactivos y testimonios</a><a href="index.html">Progreso (dashboard)</a></div></div>
  <div style="display:flex;gap:8px"><button class="btn sm" onclick="openEdit()">+ Cliente</button><button class="btn sm" onclick="logout()">Salir</button></div></div><div class="wrap">${inner}</div>`;
  window.scrollTo(0,0);
}
function logout(){setSes(null);renderLogin();}

/* ---------- vista: clientes ---------- */
function eventos(){
  const ev=[];
  F.filter(f=>f.activo).forEach(f=>{
    const ini=pd(f.inicio),fin=pd(f.fin),nc=nextCobro(f);
    if(ini&&dd(ini)>0&&dd(ini)<=31)ev.push({d:ini,f,q:'Empieza · '+(f.plan||AP[f.apartado])});
    if(fin&&dd(fin)>=0&&dd(fin)<=31)ev.push({d:fin,f,q:(f.apartado==='rdd'?'Fin de RDD':'Fin de plan')+(f.estado?' · '+f.estado:'')});
    if(nc&&dd(nc)<=31)ev.push({d:nc,f,q:'Cobro mensual · '+eur(+f.cuota_mensual||0)});
    pagos(f).forEach(p=>{const x=pd(p.fecha);if(p.estado!=='pagado'&&x&&dd(x)<=31)ev.push({d:x,f,q:'Cobro pendiente · '+eur(+p.importe||0)});});
  });
  return ev.sort((a,b)=>a.d-b.d);
}
function cardHtml(f){
  const k=keyDate(f),n=k.date?dd(k.date):null,isR=f.apartado==='rdd';
  const chips=[f.origen?`<span class="chip acc">Viene de ${esc(f.origen)}</span>`:'',f.perfil?`<span class="chip">${esc(f.perfil)}</span>`:'',
    f.estado?`<span class="chip ${/pausa/i.test(f.estado)?'bad':'ok'}">${esc(f.estado)}</span>`:'',pendiente(f)>0?`<span class="chip acc">Pendiente ${eur(pendiente(f))}</span>`:'',
    isR&&!f.estado?`<span class="chip mut">Upsell: ${esc(UPS[f.upsell]||'—')}</span>`:''].join('');
  return `<a class="cc" href="#/ficha/${encodeURIComponent(f.id)}"><div style="display:flex;align-items:center;gap:14px">${photo(f,56,14)}
  <div><div style="font-size:17px;font-weight:700">${esc(f.nombre)}</div><div class="mut" style="font-size:13px">${esc(f.plan||'')}</div></div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;min-height:24px">${chips}</div>
  <div class="rows"><div class="kv"><span class="mut">Periodo</span><b>${f.inicio?fmt(f.inicio,true):'—'} → ${f.fin?fmt(f.fin):'sin fecha de fin'}</b></div>
  <div class="kv"><span class="mut">Facturado</span><b>${factTxt(f)}</b></div>
  ${isR?`<div class="kv"><span class="mut">Test inicial → final</span><b>${f.test_inicial??'—'} → ${f.test_final??'—'}</b></div>`:''}
  <div class="kv"><span class="mut">${k.label}</span><b style="color:${n==null?'var(--mut)':dcol(n)}">${k.date?fmt(k.date,true)+' · '+inDays(n):'sin día fijado'}</b></div></div>
  ${f.notas?`<div class="mut" style="font-size:13px;padding-top:12px;border-top:1px solid var(--line)"><b style="color:var(--txt)">Notas: </b>${esc(f.notas)}</div>`:''}</a>`;
}
function viewClientes(){
  const act=F.filter(f=>f.activo),ev=eventos();
  const pend=act.reduce((a,f)=>a+pendiente(f),0),fact=act.reduce((a,f)=>a+facturado(f),0);
  const prox=ev.length?ev.map(e=>{const n=dd(e.d);return `<a class="it" href="#/ficha/${encodeURIComponent(e.f.id)}"><div class="dsp" style="font-size:24px;color:${dcol(n)}">${fmt(e.d,true).toUpperCase()}</div><div class="mut" style="font-size:12px">${inDays(n)}</div><div style="font-weight:700;padding-top:4px">${esc(e.f.nombre)}</div><div class="mut" style="font-size:12px">${esc(e.q)}</div></a>`;}).join(''):'<div class="mut">Nada en los próximos 31 días.</div>';
  const secs=AP_ORDER.map(a=>{const l=act.filter(f=>f.apartado===a).sort((x,y)=>{const A=keyDate(x).date,B=keyDate(y).date;return (A?A.getTime():9e15)-(B?B.getTime():9e15);});
    return `<div id="sec-${a}"><div class="sechd"><div class="dsp t" ${a==='rdd'?'style="color:var(--acc)"':''}>${AP[a].toUpperCase()}</div><div class="mut" style="font-size:14px">${l.length} cliente${l.length===1?'':'s'}${a==='entrenamiento'?' · '+l.filter(f=>f.origen).length+' vienen de RDD':''}${a==='rdd'?' · 30 días · test inicial y final · upsell en la semana 4':''}</div></div>
    ${l.length?`<div class="grid">${l.map(cardHtml).join('')}</div>`:`<div class="empty">Ningún cliente activo en este apartado.</div>`}</div>`;}).join('');
  frame(`<div class="h1row"><div class="dsp h1">CLIENTES ACTIVOS · ${act.length}</div><div class="pills">${AP_ORDER.map(a=>`<a href="javascript:void(0)" onclick="document.getElementById('sec-${a}').scrollIntoView({behavior:'smooth'})">${esc(AP[a].split(/ [|·(]/)[0])} · ${act.filter(f=>f.apartado===a).length}</a>`).join('')}</div></div>
  <div class="card" style="border-color:var(--acc)"><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap"><div class="sect acc">Próximos 31 días · inicios, fines de plan y cobros</div><div class="mut" style="font-size:13px">Facturado con activos: <b style="color:var(--txt)">${eur(fact)}</b> · Pendiente de cobro: <b style="color:var(--acc)">${eur(pend)}</b></div></div><div class="prox">${prox}</div></div>${secs}`,'clientes');
}

/* ---------- vista: inactivos ---------- */
function conv(){
  const conv=F.filter(f=>(f.apartado!=='rdd'&&f.origen&&/rdd|rey/i.test(f.origen))||(f.apartado==='rdd'&&f.upsell==='convertido')).length;
  const resto=F.filter(f=>f.apartado==='rdd'&&f.upsell!=='convertido').length;
  return{c:conv,t:conv+resto};
}
function viewInactivos(){
  const l=F.filter(f=>!f.activo).sort((a,b)=>(pd(b.fin)||0)-(pd(a.fin)||0)),cv=conv();
  const react=l.filter(f=>{const x=pd(f.fin);return x&&dd(x)>=-45&&f.apartado!=='rdd';});
  const rows=l.map(f=>`<tr onclick="location.hash='#/ficha/${encodeURIComponent(f.id)}'"><td><div style="display:flex;align-items:center;gap:12px">${photo(f,36,10)}<b>${esc(f.nombre)}</b></div></td>
  <td>${esc(AP[f.apartado].split(/ [|·(]/)[0])}${f.origen?'<div class="mut" style="font-size:12px">Viene de '+esc(f.origen)+'</div>':''}</td>
  <td class="${f.inicio?'':'mut'}">${f.inicio?fmt(f.inicio,true)+' → '+fmt(f.fin):'Por añadir'}</td><td><b>${facturado(f)?eur(facturado(f)):'<span class="mut">Por añadir</span>'}</b></td>
  <td><span class="chip ${f.testimonio==='recibido'?'ok':f.testimonio==='acordado'?'acc':''}">${esc(TES[f.testimonio]||'Por confirmar')}</span></td>
  <td class="${f.upsell==='convertido'?'ok':'mut'}"><b>${f.apartado==='rdd'?esc(UPS[f.upsell]||'—'):'—'}</b></td></tr>`).join('');
  frame(`<div class="dsp h1">INACTIVOS Y TESTIMONIOS</div>
  <div class="checks"><div class="chk"><div class="lbl">Clientes inactivos</div><div class="dsp" style="font-size:40px">${l.length}</div></div>
  <div class="chk"><div class="lbl">Facturado con inactivos</div><div class="dsp" style="font-size:40px">${eur(l.reduce((a,f)=>a+facturado(f),0))}</div></div>
  <div class="chk"><div class="lbl">Testimonios recibidos</div><div class="dsp" style="font-size:40px">${F.filter(f=>f.testimonio==='recibido').length}</div><div class="mut" style="font-size:13px">${F.filter(f=>f.testimonio==='acordado').length} acordados</div></div>
  <div class="chk"><div class="lbl">Upsell RDD a C360</div><div class="dsp acc" style="font-size:40px">${cv.t?Math.round(cv.c/cv.t*100):0}%</div><div class="mut" style="font-size:13px">${cv.c} de ${cv.t} clientes</div></div>
  <div class="chk"><div class="lbl">Para reactivar</div><div class="dsp" style="font-size:40px">${react.length}</div><div class="mut" style="font-size:13px">${react.length?esc(react.map(f=>f.nombre).join(', '))+' · terminaron hace menos de 45 días':'Nadie terminó en los últimos 45 días'}</div></div></div>
  <div class="card tw" style="padding:8px 24px"><table class="tbl"><thead><tr><th class="lbl">Cliente</th><th class="lbl">Producto</th><th class="lbl">Periodo</th><th class="lbl">Facturado</th><th class="lbl">Testimonio</th><th class="lbl">Upsell</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="mut">Sin clientes inactivos.</td></tr>'}</tbody></table></div>`,'inactivos');
}

/* ---------- vista: ficha ---------- */
function viewFicha(id){
  const f=byId(id);if(!f){location.hash='#/clientes';return;}
  const isR=f.apartado==='rdd',k=keyDate(f),n=k.date?dd(k.date):null,ini=pd(f.inicio),fin=pd(f.fin);
  let pct=null,prog='';
  if(ini&&fin&&fin>ini){pct=Math.max(0,Math.min(100,Math.round((today()-ini)/(fin-ini)*100)));
    const tot=Math.round((fin-ini)/86400000),day=Math.max(0,Math.min(tot,dd(ini)*-1+1));prog=isR?`Día ${day} de ${tot}`:`${pct}% del plan`;}
  const last=pd(f.ultimo_checkin),ln=last?-dd(last):null;
  const chk=(l,v,s,c)=>`<div class="chk"><div class="lbl"><span class="dot" style="background:${c}"></span>${l}</div><div style="font-size:18px;font-weight:600">${v}</div><div class="mut" style="font-size:13px">${s}</div></div>`;
  const pe=pendiente(f);
  const checks=chk('Pago',f.forma_pago==='gratis'?'Gratis':pe>0?'Pendiente '+eur(pe):'Al día',FP[f.forma_pago]||'—',pe>0?'var(--acc)':'var(--ok)')
    +chk('Onboarding',f.onboarding?'Completado':'Pendiente','<a href="javascript:void(0)" onclick="quick(\''+f.id+'\',{onboarding:'+(!f.onboarding)+'})" style="text-decoration:underline">Marcar como '+(f.onboarding?'pendiente':'completado')+'</a>',f.onboarding?'var(--ok)':'var(--acc)')
    +chk('Plan entregado',f.plan_entregado?fmt(f.plan_entregado):'Sin registrar','<a href="javascript:void(0)" onclick="quick(\''+f.id+'\',{plan_entregado:\''+iso(today())+'\'})" style="text-decoration:underline">Entregado hoy</a>',f.plan_entregado?'var(--ok)':'var(--acc)')
    +chk('Último check-in',last?(ln===0?'Hoy':'Hace '+ln+' días'):'Sin registrar','<a href="javascript:void(0)" onclick="quick(\''+f.id+'\',{ultimo_checkin:\''+iso(today())+'\'})" style="text-decoration:underline">Check-in hoy</a>',last==null?'var(--acc)':ln<=7?'var(--ok)':ln<=14?'var(--acc)':'var(--bad)')
    +chk(k.label,k.date?fmt(k.date):'Sin día fijado',k.date?inDays(n):'Añádelo en Editar',n==null?'var(--mut)':dcol(n)==='var(--txt)'?'var(--ok)':dcol(n));
  const pays=pagos(f).map((p,i)=>`<div class="pay"><div style="flex-grow:1"><div style="font-weight:600">${esc(p.concepto||'Pago')}</div><div class="mut" style="font-size:12px">${p.fecha?fmt(p.fecha):'Sin fecha'}</div></div><b>${eur(+p.importe||0)}</b>
    <button class="btn sm ${p.estado==='pagado'?'':'on'}" onclick="togglePago('${f.id}',${i})">${p.estado==='pagado'?'Pagado':'Pendiente'}</button><button class="btn sm" aria-label="Borrar pago" onclick="delPago('${f.id}',${i})">×</button></div>`).join('')||'<div class="mut" style="font-size:14px">Sin pagos registrados.</div>';
  /* recorrido automático */
  const tl=[];
  if(f.origen)tl.push({d:null,t:'Entra por '+f.origen,s:'Escalón de entrada'});
  if(ini)tl.push({d:ini,t:(dd(ini)>0?'Empezará: ':'Empieza: ')+(f.plan||AP[f.apartado]),s:AP[f.apartado]});
  pagos(f).filter(p=>p.fecha&&!(ini&&+pd(p.fecha)===+ini)).forEach(p=>tl.push({d:pd(p.fecha),t:(p.estado==='pagado'?'Pago: ':'Cobro pendiente: ')+(p.concepto||'')+' · '+eur(+p.importe||0),s:''}));
  if(isR&&f.test_final!=null)tl.push({d:fin,t:'Test final: '+f.test_final+' dominadas',s:f.test_inicial!=null?'Partía de '+f.test_inicial:''});
  if(f.activo)tl.push({d:today(),t:'Hoy',s:prog,now:1});
  if(fin)tl.push({d:fin,t:f.activo?(isR?'Fin del programa':'Fin de plan'):'Terminó',s:f.activo?inDays(dd(fin)):''});
  const dated=tl.filter(x=>x.d).sort((a,b)=>a.d-b.d),tlAll=tl.filter(x=>!x.d).concat(dated);
  const tlH=tlAll.map(x=>`<div class="tl"><div class="ln"><i style="${x.now?'background:var(--ok);border-color:var(--ok)':''}"></i><s></s></div><div class="bd"><div class="mut" style="font-size:12px">${x.d?fmt(x.d):'Antes'}</div><div style="font-weight:600">${esc(x.t)}</div><div class="mut" style="font-size:13px">${esc(x.s)}</div></div></div>`).join('');
  /* bloque RDD */
  let rdd='';
  if(isR){
    const day=ini?-dd(ini)+1:null,wk=day==null?0:day<1?0:Math.min(4,Math.ceil(day/7));
    const W=[['Semana 1','Test inicial y técnica'],['Semana 2','Volumen'],['Semana 3','Intensidad'],['Semana 4','Test final, oferta C360 y testimonio']];
    const gan=(f.test_inicial!=null&&f.test_final!=null)?f.test_final-f.test_inicial:null;
    rdd=`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div class="sect">El mes de un vistazo${day!=null&&day>=1?' · '+esc(prog):''}</div><div class="mut" style="font-size:13px">${day!=null&&day<1?'Empieza '+inDays(dd(ini)):''}</div></div>
    <div class="wk">${W.map((w,i)=>`<div class="${wk===i+1&&f.activo?'now':''}"><div class="lbl" style="${wk===i+1&&f.activo?'color:var(--acc)':wk>i+1?'color:var(--ok)':''}">${w[0]}${wk===i+1&&f.activo?' · ahora':''}</div><div style="font-weight:600">${w[1]}</div></div>`).join('')}</div></div>
    <div class="two"><div class="card"><div class="sect">Resultados · dominadas</div><div class="tests">
    <div><div class="lbl">Test inicial</div><div class="dsp" style="font-size:44px">${f.test_inicial??'—'}</div><div class="mut" style="font-size:13px">${f.inicio?fmt(f.inicio,true):''}</div></div>
    <div style="border-color:var(--acc)"><div class="lbl">Test final · día 30</div><div class="dsp acc" style="font-size:44px">${f.test_final??'—'}</div><div class="mut" style="font-size:13px">${f.test_final==null?'Pendiente'+(fin?' · '+fmt(fin,true):''):fmt(fin,true)}</div></div>
    <div><div class="lbl">Resultado</div><div class="dsp ${gan>0?'ok':''}" style="font-size:44px">${gan==null?'—':(gan>=0?'+':'')+gan}</div><div class="mut" style="font-size:13px">${gan!=null&&f.test_inicial>0?'×'+(f.test_final/f.test_inicial).toFixed(1).replace('.',',')+' sus dominadas':'Se calcula con el test final'}</div></div></div>
    <div class="fg" style="margin-top:16px"><label>Test inicial<input type="number" min="0" id="tIni" value="${f.test_inicial??''}"></label><label>Test final<input type="number" min="0" id="tFin" value="${f.test_final??''}"></label></div>
    <div style="margin-top:12px"><button class="btn sm" onclick="saveTests('${f.id}')">Guardar tests</button></div></div>
    <div class="card" style="border-color:${wk>=4&&f.upsell==='sin_ofrecer'?'var(--acc)':'var(--line)'}"><div class="sect ${wk>=4?'acc':''}">Upsell a Calistenia360</div>
    <div style="font-size:17px;font-weight:600;margin:12px 0">${f.upsell==='convertido'?'Convertido':wk>=4?'Semana 4: toca ofrecerlo, después del test final':'Se ofrece en la semana 4'+(ini?' · a partir del '+fmt(new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+21),true):'')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${Object.keys(UPS).map(u=>`<button class="btn sm ${f.upsell===u?'on':''}" onclick="quick('${f.id}',{upsell:'${u}'})">${UPS[u]}</button>`).join('')}</div>
    <div class="mut" style="font-size:13px;margin-top:12px">Conversión histórica RDD a C360: ${conv().c} de ${conv().t} (${conv().t?Math.round(conv().c/conv().t*100):0}%)</div></div></div>`;
  }
  frame(`<div><a href="#/${f.activo?'clientes':'inactivos'}" class="mut" style="font-size:14px">← Volver</a></div>
  <div class="fhead">${photo(f,132,24)}<div style="flex-grow:1;display:flex;flex-direction:column;gap:12px;min-width:260px"><div class="dsp fname">${esc(f.nombre)}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip fill">${esc(AP[f.apartado])}</span>${f.plan?`<span class="chip">${esc(f.plan)}</span>`:''}${f.perfil?`<span class="chip">${esc(f.perfil)}</span>`:''}${f.origen?`<span class="chip acc">Viene de ${esc(f.origen)}</span>`:''}${f.estado?`<span class="chip ${/pausa/i.test(f.estado)?'bad':'ok'}">${esc(f.estado)}</span>`:''}<span class="chip ${f.activo?'ok':'bad'}">${f.activo?'Activo':'Inactivo'}</span></div>
  <div><button class="btn sm" onclick="openEdit('${f.id}')">Editar ficha</button></div></div>
  <div class="big"><div class="lbl">${k.label}</div><div class="dsp" style="font-size:44px;color:${n==null||!f.activo?'var(--mut)':n>31?'var(--acc)':dcol(n)}">${n==null?'—':!f.activo?'TERMINADO':n<0?'VENCIDO':n===0?'HOY':n+' DÍAS'}</div><div style="font-size:14px">${k.date?fmt(k.date):'Sin día fijado'}</div></div></div>
  <div class="checks">${checks}</div>${rdd}
  <div class="two"><div style="display:flex;flex-direction:column;gap:24px"><div class="card"><div class="sect">Plan y pagos</div>
  <div class="fg" style="margin:16px 0"><div><div class="mut" style="font-size:12px">Inicio</div><b>${fmt(f.inicio)}</b></div><div><div class="mut" style="font-size:12px">Fin</div><b>${f.fin?fmt(f.fin):'Sin fecha de fin'}</b></div>
  <div><div class="mut" style="font-size:12px">Forma de pago</div><b>${FP[f.forma_pago]||'—'}${f.cuota_mensual?' · '+eur(+f.cuota_mensual)+'/mes':''}</b></div><div><div class="mut" style="font-size:12px">Facturado</div><b>${eur(facturado(f))}</b>${pe>0?' <span class="acc" style="font-size:13px">+ '+eur(pe)+' pendiente</span>':''}</div></div>
  ${pct!=null?`<div class="kv" style="margin-bottom:8px"><b>${esc(prog)}</b><span class="mut">${pct}%</span></div><div class="bar"><div style="width:${pct}%"></div></div>`:''}
  <div style="margin-top:16px">${pays}</div>
  <div class="fg" style="margin-top:12px"><label>Concepto<input id="pCon" placeholder="Octubre"></label><label>Importe (€)<input id="pImp" type="number" min="0" step="0.01"></label><label>Fecha<input id="pFec" type="date"></label><label>Estado<select id="pEst"><option value="pagado">Pagado</option><option value="pendiente">Pendiente</option></select></label></div>
  <div style="margin-top:12px"><button class="btn sm" onclick="addPago('${f.id}')">Añadir pago</button></div></div>
  <div class="card"><div class="sect" style="margin-bottom:16px">Recorrido del cliente</div>${tlH||'<div class="mut">Añade fechas para ver el recorrido.</div>'}</div></div>
  <div style="display:flex;flex-direction:column;gap:24px"><div class="card"><div class="sect" style="margin-bottom:12px">Notas</div><textarea id="notas" placeholder="Todo lo que quieras recordar de este cliente">${esc(f.notas||'')}</textarea><div style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn sm" onclick="quick('${f.id}',{notas:document.getElementById('notas').value})">Guardar notas</button><span class="mut" style="font-size:13px">Testimonio: </span>${Object.keys(TES).map(t=>`<button class="btn sm ${f.testimonio===t?'on':''}" onclick="quick('${f.id}',{testimonio:'${t}'})">${TES[t]}</button>`).join('')}</div></div>
  ${isR?'':`<div class="card"><div class="sect" style="margin-bottom:12px">Progreso · peso, adherencia y skills</div><div class="mut" style="font-size:14px;margin-bottom:12px">El seguimiento semanal sigue en tu dashboard de progreso. El siguiente paso es traerlo aquí dentro de la ficha.</div><a class="btn sm" style="display:inline-flex;align-items:center" href="index.html">Abrir dashboard de progreso</a></div>`}</div></div>`,f.activo?'clientes':'inactivos');
}

/* ---------- acciones ---------- */
async function save(id,patch){
  patch.updated_at=new Date().toISOString();
  const r=await api('fichas?id=eq.'+encodeURIComponent(id),'PATCH',patch);
  if(!r||!r.length)throw new Error('No se ha guardado (revisa permisos)');
  Object.assign(byId(id),r[0]);
}
async function quick(id,patch){try{await save(id,patch);toast('Guardado');route();}catch(e){fail(e);}}
function fail(e){if(e.message==='nosession'){renderLogin('La sesión ha caducado. Entra de nuevo.');}else{toast('Error: '+e.message);}}
async function togglePago(id,i){const p=JSON.parse(JSON.stringify(pagos(byId(id))));p[i].estado=p[i].estado==='pagado'?'pendiente':'pagado';quick(id,{pagos:p});}
async function delPago(id,i){if(!confirm('¿Borrar este pago?'))return;const p=pagos(byId(id)).slice();p.splice(i,1);quick(id,{pagos:p});}
async function addPago(id){
  const imp=parseFloat($('#pImp').value);if(isNaN(imp)){toast('Pon un importe');return;}
  const p=pagos(byId(id)).concat([{concepto:$('#pCon').value.trim()||'Pago',importe:imp,fecha:$('#pFec').value||null,estado:$('#pEst').value}]);quick(id,{pagos:p});
}
function saveTests(id){const v=x=>{const n=parseInt($(x).value,10);return isNaN(n)?null:n;};quick(id,{test_inicial:v('#tIni'),test_final:v('#tFin')});}

/* ---------- editar / nuevo ---------- */
function openEdit(id){
  const f=id?byId(id):{apartado:'entrenamiento',activo:true,forma_pago:'unico',upsell:'sin_ofrecer',testimonio:'por_confirmar'};
  const opt=(o,v)=>Object.keys(o).map(k=>`<option value="${k}" ${k===v?'selected':''}>${esc(o[k])}</option>`).join('');
  const i=(l,n,t,full)=>`<label class="${full?'full':''}">${l}<input id="e_${n}" type="${t||'text'}" value="${esc(f[n]??'')}"></label>`;
  $('#mbox').innerHTML=`<div class="dsp" style="font-size:32px">${id?'EDITAR FICHA':'NUEVO CLIENTE'}</div><div class="fg">
  ${i('Nombre','nombre','text',true)}<label>Apartado<select id="e_apartado">${opt(AP,f.apartado)}</select></label><label>Estado<select id="e_activo"><option value="true" ${f.activo?'selected':''}>Activo</option><option value="false" ${f.activo?'':'selected'}>Inactivo</option></select></label>
  ${i('Plan (p. ej. Trimestral · pago único)','plan')}${i('Perfil (Opositor / Sin examen)','perfil')}${i('Viene de (p. ej. RDD Premium)','origen')}${i('Aviso corto (En pausa…)','estado')}
  ${i('Inicio','inicio','date')}${i('Fin','fin','date')}<label>Forma de pago<select id="e_forma_pago">${opt(FP,f.forma_pago)}</select></label>${i('Cuota mensual (€)','cuota_mensual','number')}${i('Día de cobro (1-31)','dia_cobro','number')}
  <label>Nivel RDD<select id="e_rdd_nivel"><option value="">—</option><option ${f.rdd_nivel==='Estándar'?'selected':''}>Estándar</option><option ${f.rdd_nivel==='Premium'?'selected':''}>Premium</option></select></label>
  ${i('Foto de perfil (URL)','foto_url','url',true)}</div><div class="err" id="eErr"></div>
  <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div>${id?`<button class="btn" style="color:var(--bad)" onclick="delFicha('${id}')">Eliminar</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="saveEdit(${id?`'${id}'`:'null'})">Guardar</button></div></div>`;
  $('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open');}
async function saveEdit(id){
  const g=n=>{const el=$('#e_'+n);return el?el.value.trim():'';},num=n=>{const v=parseFloat(g(n));return isNaN(v)?null:v;};
  const d={nombre:g('nombre'),apartado:g('apartado'),activo:g('activo')==='true',plan:g('plan')||null,perfil:g('perfil')||null,origen:g('origen')||null,estado:g('estado')||null,
    inicio:g('inicio')||null,fin:g('fin')||null,forma_pago:g('forma_pago'),cuota_mensual:num('cuota_mensual'),dia_cobro:num('dia_cobro'),rdd_nivel:g('rdd_nivel')||null,foto_url:g('foto_url')||null};
  if(!d.nombre){$('#eErr').textContent='Pon el nombre';return;}
  try{
    if(id){await save(id,d);}
    else{d.id=d.nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now().toString(36);
      const r=await api('fichas','POST',[d]);F.push(r[0]);id=d.id;}
    closeModal();toast('Guardado');if(location.hash==='#/ficha/'+encodeURIComponent(id))route();else location.hash='#/ficha/'+encodeURIComponent(id);
  }catch(e){if(e.message==='nosession')fail(e);else $('#eErr').textContent=e.message;}
}
async function delFicha(id){
  if(!confirm('¿Eliminar esta ficha? No se puede deshacer.'))return;
  try{await api('fichas?id=eq.'+encodeURIComponent(id),'DELETE');F=F.filter(f=>f.id!==id);closeModal();location.hash='#/clientes';}catch(e){fail(e);}
}

/* ---------- arranque ---------- */
function route(){
  const h=location.hash||'#/clientes';
  if(h.indexOf('#/ficha/')===0)viewFicha(decodeURIComponent(h.slice(8)));
  else if(h==='#/inactivos')viewInactivos();else viewClientes();
}
async function boot(){
  if(!SES){renderLogin();return;}
  $('#app').innerHTML='<div class="wrap mut">Cargando…</div>';
  try{F=await api('fichas?select=*&order=nombre')||[];route();}
  catch(e){if(e.message==='nosession')renderLogin('Entra para ver el panel.');else $('#app').innerHTML='<div class="wrap"><div class="card"><b>No se han podido cargar las fichas.</b><div class="mut" style="margin-top:8px">'+esc(e.message)+'</div><div class="mut" style="margin-top:8px">¿Has ejecutado setup-fichas.sql en Supabase?</div><div style="margin-top:16px"><button class="btn sm" onclick="logout()">Salir</button></div></div></div>';}
}
window.addEventListener('hashchange',()=>{if(SES)route();});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
boot();
</script>
